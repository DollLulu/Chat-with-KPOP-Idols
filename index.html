<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>KATSEYE</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Press+Start+2P&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <div class="app-shell">
    <aside class="artist-rail" id="artistRail">
      <button type="button" class="artist-btn active" data-artist="katseye" aria-label="KATSEYE">
        <img src="Pic.jpg" alt="KATSEYE" />
      </button>
      <button type="button" class="artist-btn" data-artist="illit" aria-label="ILLIT">
        <img src="illit.png" alt="ILLIT" />
      </button>
      <button type="button" class="artist-btn" data-artist="cortis" aria-label="CORTIS">
        <img src="cortis.jpg" alt="CORTIS" />
      </button>
      <button type="button" class="artist-btn" data-artist="h2h" aria-label="Hearts2Hearts">
        <img src="h2h.jpg" alt="H2H" />
      </button>
      <button type="button" class="artist-btn add-btn" id="addArtistBtn" aria-label="Add Friend">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      </button>
      <input type="file" id="imageInput" accept="image/*" hidden />
    </aside>

    <div class="phone">
      <!-- Status bar -->
      <div class="status-bar">
        <span class="status-time" id="statusTime">19:55</span>
        <div class="status-icons">
          <svg viewBox="0 0 18 12" class="icon-signal"><rect x="0" y="7" width="3" height="5"/><rect x="5" y="5" width="3" height="7"/><rect x="10" y="3" width="3" height="9" opacity="0.4"/><rect x="15" y="0" width="3" height="12" opacity="0.4"/></svg>
          <svg viewBox="0 0 16 12" class="icon-wifi"><path d="M8 10.5a1.3 1.3 0 100 2.6 1.3 1.3 0 000-2.6zM4.5 7.7a5 5 0 017 0l-1.4 1.5a3 3 0 00-4.2 0zM1.8 4.9a9 9 0 0112.4 0L12.8 6.4a7 7 0 00-9.6 0z"/></svg>
          <svg viewBox="0 0 25 12" class="icon-battery"><rect x="0.5" y="0.5" width="21" height="11" rx="2.5" fill="none" stroke="currentColor"/><rect x="2" y="2" width="12" height="8" rx="1.5"/><rect x="22.5" y="4" width="2" height="4" rx="1"/></svg>
        </div>
      </div>

      <!-- Chat header -->
      <div class="chat-header">
        <button class="back-btn" aria-label="Back">
          <svg viewBox="0 0 24 24"><path d="M15 4l-8 8 8 8" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <div class="header-profile">
          <img src="Pic.jpg" alt="KATSEYE" class="header-avatar" id="headerAvatarImg" />
          <div class="header-name">
            <span class="header-username"><span id="headerNameText" contenteditable="true" spellcheck="false">KATSEYE</span> <span class="badge-wrap"><img src="check.jpg" alt="Verified" class="verified-badge" /></span></span>
            <span class="header-username-sub" id="headerUsernameText" contenteditable="true" spellcheck="false">katseyeworld</span>
          </div>
        </div>
      </div>

      <!-- Chat body -->
      <div class="chat-body" id="chatBody">
        <div class="profile-intro">
          <img src="Pic.jpg" alt="KATSEYE" class="intro-avatar" id="introAvatarImg" />
          <div class="intro-name"><span id="introNameText" contenteditable="true" spellcheck="false">KATSEYE</span> <span class="badge-wrap intro-badge-wrap"><img src="check.jpg" alt="Verified" class="verified-badge intro-badge" /></span></div>
          <div class="intro-username" id="introUsernameText" contenteditable="true" spellcheck="false">katseyeworld</div>
          <div class="intro-meta" id="introMetaText" contenteditable="true" spellcheck="false">9.4M followers &middot; 1.1K posts</div>
          <div class="intro-follow" id="introFollowText" contenteditable="true" spellcheck="false">You've followed this Instagram account since 2026</div>
        </div>

        <div class="messages" id="messages"></div>

        <div class="typing-indicator" id="typingIndicator" hidden>
          <img src="Pic.jpg" alt="" class="msg-avatar" id="typingAvatarImg" />
          <div class="typing-bubble">
            <span class="dot"></span>
            <span class="dot"></span>
            <span class="dot"></span>
          </div>
        </div>
      </div>

      <!-- Input bar -->
      <div class="input-bar">
        <div class="input-pill">
          <input type="text" id="messageInput" placeholder="Message..." autocomplete="off" />
        </div>
        <button class="send-btn" id="sendBtn" hidden>Send</button>
      </div>

      <!-- Home indicator -->
      <div class="home-indicator"><span></span></div>
    </div>

    <!-- Side Actions (Trash & Play) -->
    <div class="side-actions">
      <button type="button" id="deleteChatBtn" class="action-btn trash-btn" aria-label="Delete chat" title="Delete chat">
        <svg viewBox="0 0 24 24"><path d="M9 3h6v2h5v2H4V5h5V3zm-2 6h2v9H7V9zm4 0h2v9h-2V9zm4 0h2v9h-2V9zM6 7h12l-1 14a2 2 0 01-2 2H9a2 2 0 01-2-2L6 7z"/></svg>
      </button>
      <button type="button" id="playBtn" class="action-btn play-btn" title="Play Scenario">
        &#9658; Play
      </button>
    </div>

    <!-- Control panel -->
    <aside class="control-panel">
      <div class="panel-title-row">
        <div class="panel-title"><img src="Chat Designer.png" alt="" class="panel-icon panel-title-icon" /> Chat Designer</div>
        <button type="button" id="accountToggleBtn" class="account-toggle-btn" aria-label="Toggle account panel">
          <img src="Girl1.png" alt="Account" />
        </button>
      </div>

      <!-- Authentication -->
      <div class="panel-section auth-popover" id="auth-container" hidden>
        <h3><img src="Account.png" alt="" class="panel-icon" /> Account</h3>
        <input type="email" id="auth-email" class="panel-input" placeholder="Your email address" required />
        <input type="password" id="auth-password" class="panel-input" placeholder="Password" required />
        <div class="auth-buttons">
          <button type="button" id="btn-signin" class="auth-btn">Sign In</button>
          <button type="button" id="btn-signup" class="auth-btn">Sign Up</button>
        </div>
        <p id="auth-user-info" class="auth-user-info" style="display: none;"></p>
        <button type="button" id="btn-signout" class="auth-btn signout-btn" style="display: none;">Sign Out</button>
      </div>

      <div class="panel-section">
        <h3><img src="Theme.png" alt="" class="panel-icon" /> Theme</h3>
        <div class="theme-toggle">
          <button type="button" class="theme-btn active" data-theme="light">&#9728;&#65039; Light</button>
          <button type="button" class="theme-btn" data-theme="dark">&#127769; Dark</button>
        </div>
      </div>

      <div class="panel-section messages-panel">
        <div class="messages-panel-header">
          <h3><img src="Messages.png" alt="" class="panel-icon" /> Messages</h3>
        </div>
        <div id="messageBoxes" class="message-boxes"></div>
        <button type="button" id="addMessageBtn" class="add-message-btn">+ Add message</button>
      </div>
    </aside>
  </div>

  <script src="main.js" defer></script>
</body>
</html>
